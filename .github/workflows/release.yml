# TODO [RENAME-TRACKER]: Update all repository URLs and metadata references from 'FloStyle/m7-jellyfin' to 'FloStyle/m7-jellyfin-neo' before executing the repo rename.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build source tarball
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          git archive --format=tar.gz --prefix=m7-jellyfin-${VERSION}/ -o m7-jellyfin-${VERSION}.tar.gz HEAD
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build plugin
        run: pnpm run build
      - name: Generate SHA256 checksums
        run: |
          sha256sum dist/jellyfin.zip > SHA256SUMS.txt
          echo "SHA256 checksums generated:"
          cat SHA256SUMS.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jellyfin.zip
            m7-jellyfin-${{ github.ref_name }}.tar.gz
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
