# TODO [RENAME-TRACKER]: Update all repository URLs and metadata references from 'FloStyle/m7-jellyfin' to 'FloStyle/m7-jellyfin-neo' before executing the repo rename.
name: Dev Build

on:
  push:
    branches:
      - main
  schedule:
    # Every day at 02:00 UTC
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build source tarball
        run: |
          DATE=$(date -u +%Y%m%d)
          git archive --format=tar.gz --prefix=m7-jellyfin-dev-${DATE}/ -o m7-jellyfin-dev-${DATE}.tar.gz HEAD
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build plugin
        run: pnpm run build
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev build
          body: |
            Auto-built from `main` — **not for production use**.

            Build date: ${{ github.event.head_commit.timestamp || 'scheduled' }}
            Commit: [${{ github.sha }}](https://github.com/FloStyle/m7-jellyfin/commit/${{ github.sha }}) <!-- RENAME-TRACKER: Update to m7-jellyfin-neo -->
          prerelease: true
          make_latest: false
          files: |
            dist/jellyfin.zip
            m7-jellyfin-dev-*.tar.gz
